<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2563eb"><title>Connect Social</title>
<link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">Connect<span>•</span></div><div class="top-actions"><span id="currentUser" class="user-pill">Guest</span><button id="themeBtn" class="secondary">🌙 Dark</button></div></header>
<main>
<section id="authView" class="view auth-view"><div class="card auth-card">
<h1>Welcome to Connect</h1><p class="muted">Chat, share and connect with people.</p>
<div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="signup">Sign up</button></div>
<div class="auth-methods"><button type="button" class="method active" data-method="email">Email</button><button type="button" class="method" data-method="phone">Phone number</button></div>
<form id="authForm">
<label id="usernameField" class="hidden">Username<input id="username" minlength="2" maxlength="24" autocomplete="username" placeholder="Choose a username"></label>
<label id="emailField">Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com"></label>
<label id="phoneField" class="hidden">Phone number<input id="phone" type="tel" autocomplete="tel" placeholder="+2348012345678"></label>
<label id="passwordField">Password<input id="password" type="password" minlength="6" autocomplete="current-password" placeholder="At least 6 characters"></label>
<label id="emailCodeField" class="hidden">Email verification code<input id="emailCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="Enter the 6-digit code"></label>
<button type="button" id="emailCodeVerify" class="secondary hidden">Verify code</button>
<div id="recaptcha-container"></div>
<label id="smsCodeField" class="hidden">SMS verification code<input id="smsCode" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter the 6-digit code"></label>
<button class="primary" type="submit" id="authSubmit">Login</button>
</form><p id="authMessage" class="message" role="status"></p>
</div></section>
<section id="homeView" class="view hidden"><div class="layout">
<aside class="sidebar card">
<button class="nav active" data-page="feed">🏠 Feed</button><button class="nav" data-page="search">🔎 Find people</button>
<button class="nav" data-page="friends">👥 Friends</button><button class="nav" data-page="chats">💬 Messages <span id="messageBadge"></span></button>
<button class="nav" data-page="notifications">🔔 Alerts <span id="notificationBadge"></span></button><button class="nav" data-page="profile">👤 Profile</button><button class="nav" id="logoutBtn">↪ Log out</button>
</aside><section class="content">
<div id="feedPage" class="page"><div class="card composer"><h2>What's happening?</h2><form id="postForm"><textarea id="postText" maxlength="500" placeholder="Share something with your friends..."></textarea><div class="post-tools"><label class="photo-picker" for="postImage">📷 Add photo</label><input id="postImage" type="file" accept="image/*" hidden><button class="primary" type="submit">Post</button></div><div id="postImagePreview" class="image-preview hidden"><img id="postPreviewImg" alt="Selected photo preview"><button type="button" id="removePostImage" class="secondary">Remove photo</button></div></form></div><div id="posts"></div></div>
<div id="searchPage" class="page hidden"><div class="card"><h2>Find people</h2><input id="userSearch" placeholder="Search usernames..."><div id="searchResults"></div></div></div>
<div id="friendsPage" class="page hidden"><div class="card"><h2>Friend requests</h2><div id="friendRequests"></div></div><div class="card"><h2>Your friends</h2><div id="friendsList"></div></div></div>
<div id="chatsPage" class="page hidden"><div class="chat-layout card"><div class="chat-list"><h2>Messages</h2><div id="chatContacts"></div></div><div class="chat-box"><div class="chat-head"><b id="chatName">Choose a friend</b><span id="chatStatus"></span></div><div id="messages" class="messages"></div><form id="messageForm" class="message-form"><input id="messageInput" maxlength="1000" placeholder="Type a message..." required><button class="primary" type="submit">Send</button></form></div></div></div>
<div id="notificationsPage" class="page hidden"><div class="card"><div class="notification-heading"><h2>Notifications</h2><button id="markAllRead" class="secondary" type="button">Mark all as read</button></div><div id="notifications"></div></div></div>
<div id="profilePage" class="page hidden"><div class="card profile"><div class="avatar large" id="profileAvatar">?</div><h2 id="profileName"></h2><p id="profileBio" class="muted"></p><label>Profile picture<input id="avatarInput" type="file" accept="image/*"></label><label>Display name<input id="displayName" maxlength="40" placeholder="Your display name"></label><label>Bio<textarea id="bioInput" maxlength="160" placeholder="Tell people about yourself"></textarea></label><button class="primary" id="saveProfile">Save profile</button></div></div>
</section></div></section>
</main></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

</body></html>
